[project]
name = "ai-blog-digest"
version = "0.1.0"
description = "Daily AI blog digest: OPML feeds -> Jev classification -> LLM summaries -> Telegram"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7",
    "feedparser>=6.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-blog-digest = "digest.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
